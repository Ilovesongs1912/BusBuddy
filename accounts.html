<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BusBuddy - Accounts</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>

    <h1>
        <img src="bus2.jpg" alt="BusBuddy logo">
        BusBuddy
    </h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="accounts.html">Accounts</a>
        <a href="signup.html">Sign Up</a>
    </nav>

</header>

<main>

    <section class="dashboard">

        <!-- Hehehehe Fake add money, and account info.-->
        <div class="dashboard-top">

            <div class="dashboard-user">
                <div class="avatar-circle" id="avatarInitial"></div>
                <div>
                    <p class="dashboard-username" id="displayUsername"></p>
                    <p class="dashboard-balance">Balance: <span id="displayBalance">RM 0.00</span></p>
                    <p>Language: <span id="displayLanguage"></span></p>
                </div>
            </div>

            <div class="dashboard-actions">
                <button class="btn-pill btn-pill-outline" onclick="addMoney()">Add Money</button>
                <button class="btn-pill btn-pill-dark" onclick="onDemand()">On-Demand</button>
            </div>

        </div>

        <!-- Bus schedule (Not completed yet, still considering which one to choose.)-->
        <div class="panel-box">
            <h3 class="panel-title">Bus Schedule & Bus Arrival Times </h3>
            <div class="timeline" id="stopsTimeline">
                <!-- filled in by accounts.js -->

                <label for="stopSelect">Choose Your Preffered Bus Stop</label>

                <select id="stopSelect">
                <option>Loading bus stops...</option>
              </select>
            </div>
        </div>

        <!-- using malaysia api for this one. Also not comfirmed.-->
        <div class="panel-box">
            <h3 class="panel-title">Live Tracking</h3>

            <div class="tracking-box">
                <img src="Gps.jpg" alt="Bus route map" class="tracking-image">
            </div>

            <p class="tracking-eta" id="trackingEta">Arriving in 6 min</p>
        </div>

        <button class="btn-pill btn-pill-outline logout-btn" onclick="logout()">Log Out</button>

    </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="js/gtfs.js"></script>
<script src="js/accounts.js"></script>
</body>
</html>
